name: Workflow improvement
description: Describe a research task that is difficult to complete.
title: "[Workflow] "
body:
  - type: markdown
    attributes:
      value: "Use invented examples. Do not include private research, papers, conversations, or credentials."
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: obstacle
    attributes:
      label: What makes it difficult today?
      description: Include your current workaround, if any.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What would a successful result look like?
    validations:
      required: true
