[project]
name = "research-lab"
version = "1.3.45"
description = "Local-first research agent for the weekly-artifact system"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.54",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.32",
  "httpx>=0.28.1",
  "pydantic>=2.13",
  "ruamel.yaml>=0.19.1",
  "pymupdf>=1.28.2",
  "rapidfuzz>=3.14.6",
  "typer>=0.27.2",
  "python-dotenv>=1.2.3",
  "markdown-it-py>=4.2",
  "duckdb>=1.5.6",
  "pandas>=3.0.6",
  "statsmodels>=0.15.0",
  "scipy>=1.18.1",
  "networkx>=3.7",
  "matplotlib>=3.11.2",
  "pyreadstat>=1.3.6",
  "openpyxl>=3.1.5",
  "pywebview>=6.2",
  "pyfixest>=0.60.0",
  "differences>=0.3.0",
  "python-pptx>=1.0.2",
]

[project.scripts]
rl = "research_lab.cli:app"

[dependency-groups]
dev = [
    "pyinstaller>=6.22",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "research_lab"
module-root = "app"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
